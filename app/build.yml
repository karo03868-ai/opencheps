name: Build ChessVision APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p extracted_project
          unzip -o ChessVision.zip -d extracted_project

      - name: Check project files
        run: |
          ls -la extracted_project
          test -f extracted_project/gradlew

      - name: Build APK
        run: |
          cd extracted_project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChessVision-Debug
          path: extracted_project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
